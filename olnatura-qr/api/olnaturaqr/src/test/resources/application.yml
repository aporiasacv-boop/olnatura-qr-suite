spring:
  datasource:
    url: jdbc:h2:mem:olnatura_rc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: rc-test-secret-key-at-least-32-characters-long

app:
  dynamics:
    mode: mock
  bootstrap:
    admin:
      enabled: false
  cors:
    allowed-origins: http://localhost:5173