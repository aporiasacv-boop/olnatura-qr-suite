server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    # Override with APP_CORS_ALLOWED_ORIGINS in each environment. No prod hosts hard-coded.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  dynamics:
    mode: ${APP_DYNAMICS_MODE:mock}
    base-url: ${APP_DYNAMICS_BASE_URL:}
    resource: ${APP_DYNAMICS_RESOURCE:}
    tenant-id: ${APP_DYNAMICS_TENANT_ID:}
    client-id: ${APP_DYNAMICS_CLIENT_ID:}
    client-secret: ${APP_DYNAMICS_CLIENT_SECRET:}
    token-url: ${APP_DYNAMICS_TOKEN_URL:}
    connect-timeout: ${APP_DYNAMICS_CONNECT_TIMEOUT:3s}
    read-timeout: ${APP_DYNAMICS_READ_TIMEOUT:10s}

  diagnostics:
    # Carpeta donde se guardan capturas JSON (ANTES/DESPUES). Override con APP_DIAGNOSTICS_DIR.
    dir: ${APP_DIAGNOSTICS_DIR:diagnostics}

  auth:
    cookie:
      name: "qr_session"
      max-age-seconds: 86400
      secure: false
      same-site: "Lax"

  # Admin inicial (idempotente). No crea usuarios demo.
  # Si el usuario ya existe, no se modifica. Override vía APP_BOOTSTRAP_ADMIN_*.
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:true}
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@olnatura.local}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin123!}

jwt:
  # Obligatorio vía entorno. Sin valor por defecto.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
