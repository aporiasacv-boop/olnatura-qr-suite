server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/olnatura_qr
    username: olnatura
    password: olnatura123

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://192.168.41.177:5173,http://192.168.41.177:3000,http://192.168.41.206:3000,http://192.168.41.206:5173,http://192.168.41.230:5173,http://192.168.41.230:3000"
  dynamics:
    mode: ${APP_DYNAMICS_MODE:real}
    base-url: ${APP_DYNAMICS_BASE_URL:https://olnatura-production.operations.dynamics.com}
    bearer-token: ${APP_DYNAMICS_BEARER_TOKEN:}
    connect-timeout: ${APP_DYNAMICS_CONNECT_TIMEOUT:3s}
    read-timeout: ${APP_DYNAMICS_READ_TIMEOUT:10s}

  auth:
    cookie:
      name: "qr_session"
      max-age-seconds: 86400
      secure: false
      same-site: "Lax"

jwt:
  secret: ${JWT_SECRET:dev-secret-change-me-please-dev-secret-change-me}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
